# Ambiente de desenvolvimento do Radar de Licitações.
# Os comandos abaixo são iguais no PowerShell e no bash:
#
#   docker compose up -d --build                  sobe o banco e o app  -> http://localhost:8501
#   docker compose run --rm dev bash banco/migrar.sh                   cria as tabelas (DDL)
#   docker compose run --rm dev psql -f banco/carga/01_staging.sql     carrega os CSVs (DML)
#   docker compose run --rm dev pytest                                 roda os testes
#   docker compose --profile ferramentas up -d adminer                 Adminer -> http://localhost:8080
#   docker compose down                  para tudo (os dados do banco ficam no volume)
#   docker compose down -v               para tudo e APAGA o banco local
name: radar

x-ambiente: &ambiente
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres?sslmode=disable
  # Variáveis padrão do psql: com elas, `psql -f arquivo.sql` já sabe onde conectar
  PGHOST: db
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
  PGDATABASE: postgres
  PGSSLMODE: disable
  PGTZ: America/Sao_Paulo
  RADAR_OLLAMA_URL: http://ollama:11434

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORTA:-54322}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: radar-dev:local
    command:
      - streamlit
      - run
      - app/Inicio.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.runOnSave=true
      - --server.fileWatcherType=poll
      - --browser.gatherUsageStats=false
    environment: *ambiente
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/workspace
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

  # Container de trabalho: use com `docker compose run --rm dev <comando>`
  dev:
    build: .
    image: radar-dev:local
    profiles: ["dev"]
    environment: *ambiente
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:6.1.2-standalone
    profiles: ["ferramentas"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      - db

  # LLM local para os resumos (Sprint 11). Baixe um modelo com:
  #   docker compose --profile ia up -d ollama
  #   docker compose exec ollama ollama pull qwen2.5:3b
  ollama:
    image: ollama/ollama:0.40.4
    profiles: ["ia"]
    ports:
      - "11434:11434"
    volumes:
      - modelos-ollama:/root/.ollama

volumes:
  dados-postgres:
  modelos-ollama:
