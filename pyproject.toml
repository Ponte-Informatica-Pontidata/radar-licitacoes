[project]
name = "radar-licitacoes"
version = "0.1.0"
description = "Radar de Licitações: licitações abertas do PNCP com busca por significado e resumos por IA (Laboratório Pontidata)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pandas>=2.2",
    "pgvector>=0.5,<0.6",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.6,<3",
    "streamlit>=1.66,<2",
    "typer>=0.15",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
# Instalado a partir da Sprint 8 (embeddings). Fica fora do ambiente padrão para a imagem continuar leve.
ia = ["fastembed>=0.9,<0.10"]

[project.scripts]
radar = "radar.cli:app"

[dependency-groups]
dev = [
    "duckdb>=1.5,<2",
    "pre-commit>=4",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "estagiaria(issue): tarefa da estagiária ainda pendente (procure TODO(estagiaria) no código)",
    "integracao: precisa do banco (DATABASE_URL) com as migrations e a carga aplicadas",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Acentos e travessões são normais em português; o tamanho das linhas fica a cargo do "ruff format".
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["radar", "apoio"]
