name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint e formatação (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  testes:
    name: Testes unitários (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.14 entra porque o Streamlit Community Cloud pode construir o app nessa versão
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "not integracao"

  banco:
    name: Banco do zero (migrations + carga + integração)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - name: Migrations (DDL)
        run: bash banco/migrar.sh
      - name: Carga dos CSVs e validação (DML)
        run: bash banco/carregar.sh
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen
      - name: Testes de integração
        run: uv run pytest -m integracao

  segredos:
    name: Nenhum segredo no repositório (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (todo o histórico)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
